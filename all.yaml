# ============================================================
# Mihomo/Clash Meta 优化配置
# 基于实际节点命名修正 filter + 补充完整 DNS 配置
# ============================================================

mixed-port: 7890
allow-lan: false
bind-address: "*"
ipv6: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# ==================== DNS 配置（优化版） ====================
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - localhost.ptlogin2.qq.com
    - "*.msftncsi.com"
    - www.msftconnecttest.com
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver-policy:
    "98k2887114514.28870721.xyz": https://dns.alidns.com/dns-query
    "cloudflare-ech.com": https://dns.alidns.com/dns-query
    geosite:cn:
      - 119.29.29.29
      - 223.5.5.5
    geosite:geolocation-!cn:
      - tls://1.0.0.1:853
      - tls://dns.google:853
  proxy-server-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8
    - 1.1.1.1
    - tls://1.0.0.1:853
    - tls://dns.google:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4

# ==================== 订阅来源 ====================
proxy-providers:
  cf-all:
    type: http
    url: "https://SUBAPI.cmliussss.net/sub?target=clash&url=你的原始订阅链接"
    interval: 86400
    path: ./providers/cf-all.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 180
      lazy: true

# ==================== 策略组 ====================
proxy-groups:
  # ① 主开关：手动选走哪个策略
  - name: 🚀 节点选择
    type: select
    proxies:
      - ⚡ 自动优选
      - ♻️ 负载均衡
      - 🔯 故障转移
      - 🇺🇸 美国-CF
      - 🇩🇪 德国-CF
      - 🇸🇬 新加坡-CF
      - 🌐 手动切换

  # ② 自动测速核心组：延迟最低排第一
  - name: ⚡ 自动优选
    type: url-test
    use: [cf-all]
    filter: "(?i)(CF|🇩🇪|🇸🇬|DE|SG|SIN|法兰克福|新加坡)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    hidden: false

  # ③ 流量分散（下载/多开场景）
  - name: ♻️ 负载均衡
    type: load-balance
    strategy: consistent-hashing
    use: [cf-all]
    filter: "(?i)(CF|🇩🇪|🇸🇬|DE|SG|SIN|法兰克福|新加坡)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ④ 主节点挂了自动切下一个
  - name: 🔯 故障转移
    type: fallback
    use: [cf-all]
    filter: "(?i)(CF|🇩🇪|🇸🇬|DE|SG|SIN|法兰克福|新加坡)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ⑤ 美国-CF（独立测速）
  - name: 🇺🇸 美国-CF
    type: url-test
    use: [cf-all]
    filter: "(?i)(CF)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ⑥ 德国-CF（独立测速）
  - name: 🇩🇪 德国-CF
    type: url-test
    use: [cf-all]
    filter: "(?i)(🇩🇪|DE|法兰克福)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ⑦ 新加坡-CF（独立测速）
  - name: 🇸🇬 新加坡-CF
    type: url-test
    use: [cf-all]
    filter: "(?i)(🇸🇬|SG|SIN|新加坡)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ⑧ 全部节点平铺，手动点名用
  - name: 🌐 手动切换
    type: select
    use: [cf-all]
    filter: "(?i)(CF|🇩🇪|🇸🇬|DE|SG|SIN|法兰克福|新加坡)"

  # ⑨ 漏网之鱼
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

# ==================== 分流规则 ====================
rules:
  # —— 局域网直连 ——
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # —— 完全版去广告（三层叠加）——
  - RULE-SET,banad,REJECT
  - RULE-SET,banprogramad,REJECT
  - RULE-SET,baneasylischina,REJECT

  # —— 谷歌中国直连 ——
  - RULE-SET,googlecn,DIRECT

  # —— 国内直连 ——
  - RULE-SET,china_domain,DIRECT
  - RULE-SET,china_company_ip,DIRECT
  - RULE-SET,china_ip,DIRECT
  - RULE-SET,download,DIRECT

  # —— 系统服务直连 ——
  - RULE-SET,apple,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,onedrive,DIRECT

  # —— GEOIP ——
  - GEOIP,CN,DIRECT,no-resolve

  # —— 兜底 ——
  - MATCH,🐟 漏网之鱼

# ==================== 规则集定义 ====================
