# ============================================================
# Mihomo / Clash Meta 配置（修正版）
# 结构优化：彻底分离 CF 节点与国家节点
# ============================================================

mixed-port: 7890
allow-lan: false
bind-address: "*"
ipv6: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# ==================== DNS 配置 ====================
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - localhost.ptlogin2.qq.com
    - "*.msftncsi.com"
    - www.msftconnecttest.com
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  # nameserver-policy:
  #   "98k2887114514.28870721.xyz": https://dns.alidns.com/dns-query
  #   "cloudflare-ech.com": https://dns.alidns.com/dns-query
  nameserver-policy:
    "98k2887114514.28870721.xyz": "223.5.5.5"
    "cloudflare-ech.com": "223.5.5.5"
    geosite:cn:
      - 119.29.29.29
      - 223.5.5.5
    geosite:geolocation-!cn:
      - tls://1.0.0.1:853
      - tls://dns.google:853
  proxy-server-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8
    - 1.1.1.1
    - tls://1.0.0.1:853
    - tls://dns.google:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4

# ==================== 订阅来源 ====================
proxy-providers:
  provider-all:
    type: http
    url: ""
    interval: 86400
    path: ./providers/provider-all.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 180
      lazy: true

# ==================== 策略组 ====================
proxy-groups:
  # ① 主开关
  - name: 🚀 节点选择
    type: select
    proxies:
      - ⚡ 自动优选
      - 🤖 Gemini 专项
      - 🇺🇸 美国节点
      - 🇩🇪 德国节点
      - 🇸🇬 新加坡节点
      - ☁️ Cloudflare
      - ♻️ 负载均衡
      - 🔯 故障转移
      - 🌐 手动切换

  # ② 自动测速组
  - name: ⚡ 自动优选
    type: url-test
    proxies:
      - 🇺🇸 美国节点
      - 🇩🇪 德国节点
      - 🇸🇬 新加坡节点
      - ☁️ Cloudflare
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ③ Gemini 专属组：采用 fallback 保证 IP 稳定，默认优先走新加坡/美国
  - name: 🤖 Gemini 专项
    type: fallback
    proxies:
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国节点
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ④ 纯正美国组（改用 fallback 保持 IP 稳定，排除 CF）
  - name: 🇺🇸 美国节点
    type: fallback
    use: [provider-all]
    filter: "^(?=.*(?i)(🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞))(?!.*(?i)(CF|Cloudflare)).*$"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ⑤ 纯正德国组（改用 fallback，排除 CF）
  - name: 🇩🇪 德国节点
    type: fallback
    use: [provider-all]
    filter: "^(?=.*(?i)(🇩🇪|德国|DE|法兰克福|Frankfurt|Berlin|Munich|München|Düsseldorf))(?!.*(?i)(CF|Cloudflare)).*$"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ⑥ 纯正新加坡组（改用 fallback 保持 IP 稳定，排除 CF）
  - name: 🇸🇬 新加坡节点
    type: fallback
    use: [provider-all]
    filter: "^(?=.*(?i)(🇸🇬|新加坡|SG|SIN|Singapore))(?!.*(?i)(CF|Cloudflare)).*$"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ⑦ 独立 Cloudflare 组
  - name: ☁️ Cloudflare
    type: url-test
    use: [provider-all]
    filter: "(?i)(CF|Cloudflare|优选IP|自建CF)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # ⑧ 负载均衡
  - name: ♻️ 负载均衡
    type: load-balance
    strategy: consistent-hashing
    proxies:
      - 🇺🇸 美国节点
      - 🇩🇪 德国节点
      - 🇸🇬 新加坡节点
      - ☁️ Cloudflare
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ⑨ 全局故障转移
  - name: 🔯 故障转移
    type: fallback
    proxies:
      - 🇺🇸 美国节点
      - 🇩🇪 德国节点
      - 🇸🇬 新加坡节点
      - ☁️ Cloudflare
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ⑩ 手动切换
  - name: 🌐 手动切换
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇩🇪 德国节点
      - 🇸🇬 新加坡节点
      - ☁️ Cloudflare

  # ⑪ 漏网之鱼
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

# ==================== 分流规则 ====================
rules:
  # —— 局域网直连 ——
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # —— 广告拦截 ——
  - RULE-SET,banad,REJECT
  - RULE-SET,banprogramad,REJECT
  - RULE-SET,baneasylischina,REJECT

  # —— Gemini 专项分流（必须置于 googlecn 之前） ——
  - RULE-SET,gemini,🤖 Gemini 专项

  # —— 谷歌中国直连 ——
  - RULE-SET,googlecn,DIRECT

  # —— 国内直连 ——
  - RULE-SET,china_domain,DIRECT
  - RULE-SET,china_company_ip,DIRECT
  - RULE-SET,china_ip,DIRECT
  - RULE-SET,download,DIRECT

  # —— 系统服务直连 ——
  - RULE-SET,apple,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,onedrive,DIRECT

  # —— GEOIP ——
  - GEOIP,CN,DIRECT,no-resolve

  # —— 兜底 ——
  - MATCH,🐟 漏网之鱼

# ==================== 规则集定义 ====================
