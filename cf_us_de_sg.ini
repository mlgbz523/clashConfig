[custom]
; 启用规则生成器 & 覆盖原始规则
enable_rule_generator=true
overwrite_original_rules=true

; ====== 策略组定义 ======
; 主节点选择：只匹配 美国/德国/新加坡 的 CF 节点
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔯 故障转移`[]♻️ 负载均衡`[]DIRECT`(?i)(🇺🇸|🇩🇪|🇸🇬|美国|德国|新加坡|US|DE|SG|United States|Germany|Singapore|Frankfurt|Berlin|Munich|Dallas|Los|San|Chicago|New York)

; 自动测速（url-test）：只测速这三个国家的节点
custom_proxy_group=♻️ 自动选择`url-test`(?i)(🇺🇸|🇩🇪|🇸🇬|美国|德国|新加坡|US|DE|SG|United States|Germany|Singapore|Frankfurt|Berlin|Munich|Dallas|Los|San|Chicago|New York)`http://www.gstatic.com/generate_204`300,,50

; 故障转移（fallback）：主节点挂了自动切下一个
custom_proxy_group=🔯 故障转移`fallback`(?i)(🇺🇸|🇩🇪|🇸🇬|美国|德国|新加坡|US|DE|SG|United States|Germany|Singapore|Frankfurt|Berlin|Munich|Dallas|Los|San|Chicago|New York)`http://www.gstatic.com/generate_204`180

; 负载均衡（load-balance）：流量分散到三个国家
custom_proxy_group=♻️ 负载均衡`load-balance`(?i)(🇺🇸|🇩🇪|🇸🇬|美国|德国|新加坡|US|DE|SG|United States|Germany|Singapore|Frankfurt|Berlin|Munich|Dallas|Los|San|Chicago|New York)`http://www.gstatic.com/generate_204`180

; 漏网之鱼：默认走节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`

